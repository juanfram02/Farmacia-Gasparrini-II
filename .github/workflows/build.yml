name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar la app
        run: gradle --no-daemon assembleRelease

      - name: Preparar el archivo
        run: cp app/build/outputs/apk/release/app-release.apk farmacia-gasparrini-ii.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: farmacia-gasparrini-ii-apk
          path: farmacia-gasparrini-ii.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Farmacia Gasparrini II v1.${{ github.run_number }}
          body: |
            Bajá **farmacia-gasparrini-ii.apk** desde el celular e instalalo.
            Si ya tenías una versión anterior, se instala encima sin perder nada.
          files: farmacia-gasparrini-ii.apk
          make_latest: true
